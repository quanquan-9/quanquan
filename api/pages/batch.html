<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>quanquan · 批量处理</title>
<style>
:root{--bg:#0a0a0f;--panel:#12121a;--card:#181825;--hover:#1e1e30;--border:#252540;--glow:#3a3a60;--text:#e8e8f0;--dim:#8888aa;--accent:#7c3aed;--accent2:#a78bfa;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--radius:12px;--r:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 60% 30%,rgba(124,58,237,.05) 0%,transparent 50%),radial-gradient(ellipse at 30% 70%,rgba(34,197,94,.04) 0%,transparent 50%)}
nav{position:relative;z-index:10;display:flex;align-items:center;gap:8px;padding:14px 28px;background:rgba(18,18,26,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-wrap:wrap}
nav .logo{font-weight:800;font-size:18px;color:var(--text);margin-right:auto;display:flex;align-items:center;gap:8px}
nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:20px;transition:all .2s}
nav a:hover,nav a.active{color:var(--accent2);background:rgba(124,58,237,.1)}
.container{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:28px}
h1{font-size:28px;margin-bottom:24px;background:linear-gradient(135deg,var(--accent2),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
.panel h3{font-size:16px;margin-bottom:16px;color:var(--accent2)}
input,textarea,select{width:100%;padding:10px 14px;background:var(--hover);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:14px;font-family:inherit;margin-bottom:12px;transition:border .2s}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:140px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7}
.btn{padding:14px 24px;border-radius:var(--r);border:none;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;width:100%}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{box-shadow:0 0 24px rgba(124,58,237,.4)}
.result{padding:16px;border-radius:var(--r);margin-top:12px}
.r-success{border-left:3px solid var(--green);background:rgba(34,197,94,.05)}.r-error{border-left:3px solid var(--red);background:rgba(239,68,68,.05)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin:2px 3px}
.b-queued{background:rgba(245,158,11,.15);color:var(--yellow)}.b-processing{background:rgba(59,130,246,.15);color:var(--blue)}.b-completed{background:rgba(34,197,94,.15);color:var(--green)}.b-failed{background:rgba(239,68,68,.15);color:var(--red)}
.footer{text-align:center;padding:20px;color:var(--dim);font-size:11px}
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:12px 20px;border-radius:var(--r);font-size:13px;font-weight:600;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green);animation:slide .3s ease}
@keyframes slide{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){nav{gap:4px;padding:10px 16px}}
</style>
</head>
<body>
<div class="bg"></div>
<nav>
  <span class="logo">🎬 quanquan</span>
  <a href="/dashboard">🎛️ 控制台</a>
  <a href="/api/v1/vfx/presets">🎨 VFX</a>
  <a href="/api/v1/analytics/dashboard">📈 分析</a>
  <a href="/api/v1/batch" class="active">📦 批量</a>
  <a href="/api/v1/thumbnail">🖼️ 缩略图</a>
</nav>
<div class="container">
  <h1>📦 批量处理中心</h1>
  <div class="panel">
    <h3>📝 批量创建项目</h3>
    <label style="font-size:12px;color:var(--dim);display:block;margin-bottom:6px">每行一个：主题,时长(秒),风格</label>
    <textarea id="input" placeholder="赛博朋克夜之城,60,cyberpunk&#10;春日花海延时摄影,120,nature&#10;AI科技前沿解读,180,tech&#10;美食探店Vlog,90,food&#10;城市夜景航拍,60,urban&#10;健身教程打卡,45,sports"></textarea>
    <div style="display:flex;gap:16px;align-items:end">
      <div style="width:100px"><label style="font-size:11px;color:var(--dim);display:block;margin-bottom:4px">并发数</label><input type="number" id="concurrency" value="3" min="1" max="10"></div>
      <button class="btn btn-primary" onclick="submit()">🚀 批量提交</button>
    </div>
  </div>
  <div id="result"></div>
</div>
<div id="toasts"></div>
<div class="footer">quanquan v7.0 · 批量处理引擎</div>
<script>
const A='/api/v1';
function toast(m){const c=document.getElementById('toasts'),e=document.createElement('div');e.className='toast';e.textContent=m;c.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='.3s';setTimeout(()=>e.remove(),300)},3000)}
async function submit(){
  const raw=document.getElementById('input').value.trim();
  if(!raw){toast('请输入项目列表');return}
  const lines=raw.split('\n').filter(l=>l.trim());
  const requests=lines.map(l=>{const p=l.split(',');return{text:(p[0]||'').trim(),duration:parseInt(p[1])||180,style:(p[2]||'auto').trim()}});
  try{
    const r=await fetch(A+'/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requests,max_concurrency:parseInt(document.getElementById('concurrency').value)||3})});
    const d=await r.json();
    const statuses=(d.status?.projects||[]).map(p=>`<span class="badge b-${p.status}">${(p.project_id||'').slice(0,16)} [${p.status}]</span>`).join(' ');
    document.getElementById('result').innerHTML=`<div class="result r-success"><h3 style="color:var(--green);margin-bottom:8px">✅ 批量提交成功</h3><p>批次ID: <code style="color:var(--accent2);background:var(--hover);padding:2px 8px;border-radius:4px">${d.batch_id}</code></p><p style="margin:8px 0">共 <b>${d.total}</b> 个项目 · 排队 ${d.status?.queued||0} · 处理中 ${d.status?.processing||0}</p><div style="margin-top:12px">${statuses}</div></div>`;
  }catch(e){document.getElementById('result').innerHTML=`<div class="result r-error"><h3 style="color:var(--red)">❌ 提交失败</h3><p>${e.message}</p></div>`}
}
</script>
</body>
</html>

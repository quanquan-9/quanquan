<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>quanquan · 多平台发布</title>
<style>
:root{--bg:#0a0a0f;--panel:#12121a;--card:#181825;--hover:#1e1e30;--border:#252540;--glow:#3a3a60;--text:#e8e8f0;--dim:#8888aa;--accent:#7c3aed;--accent2:#a78bfa;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--pink:#ec4899;--bili:#fb7299;--douyin:#ff0050;--yt:#ff0000;--radius:12px;--r:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 10%,rgba(251,114,153,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(255,0,0,.04) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(124,58,237,.04) 0%,transparent 60%)}
nav{position:relative;z-index:10;display:flex;align-items:center;gap:8px;padding:14px 28px;background:rgba(18,18,26,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-wrap:wrap}
nav .logo{font-weight:800;font-size:18px;color:var(--text);margin-right:auto;display:flex;align-items:center;gap:8px}
nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:20px;transition:all .2s}
nav a:hover,nav a.active{color:var(--accent2);background:rgba(124,58,237,.1)}
.container{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:28px}
h1{font-size:28px;margin-bottom:24px;background:linear-gradient(135deg,var(--accent2),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:28px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;text-align:center;transition:all .3s;position:relative;overflow:hidden}
.pcard:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.pcard .picon{font-size:48px;margin-bottom:12px}
.pcard .pname{font-weight:700;font-size:20px;margin-bottom:8px}
.pcard .pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;animation:pulse 2s infinite}
.pcard .pspecs{font-size:12px;color:var(--dim);line-height:1.8;margin-top:8px}
.pcard.bili{border-top:3px solid var(--bili)}.pcard.douyin{border-top:3px solid var(--douyin)}.pcard.youtube{border-top:3px solid var(--yt)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden}
.phead{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.pbody{padding:20px}
input,textarea,select{width:100%;padding:10px 14px;background:var(--hover);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:14px;font-family:inherit;margin-bottom:12px;transition:border .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{padding:12px 24px;border-radius:var(--r);border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;width:100%}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{box-shadow:0 0 24px rgba(124,58,237,.4)}
.result{padding:16px;border-radius:var(--r);margin-top:12px;display:none}.r-success{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green)}.r-error{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.toast{position:fixed;top:20px;right:20px;z-index:999;padding:12px 20px;border-radius:var(--r);font-size:13px;font-weight:600;animation:slide .3s ease}
.t-success{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green)}.t-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}
@keyframes slide{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.footer{text-align:center;padding:20px;color:var(--dim);font-size:11px}
@media(max-width:768px){.grid3{grid-template-columns:1fr}nav{gap:4px;padding:10px 16px}}
</style>
</head>
<body>
<div class="bg"></div>
<nav>
  <span class="logo">🎬 quanquan</span>
  <a href="/dashboard">🎛️ 控制台</a>
  <a href="/api/v1/health">💚 健康</a>
  <a href="/api/v1/vfx/presets">🎨 VFX</a>
  <a href="/api/v1/platforms" class="active">📡 发布</a>
  <a href="/api/v1/analytics/dashboard">📈 分析</a>
  <a href="/api/v1/batch">📦 批量</a>
</nav>
<div class="container">
  <h1>📡 多平台发布中心</h1>
  <div class="grid3">
    <div class="pcard bili"><div class="picon">📺</div><div class="pname">B站 Bilibili</div><div class="pstatus"><span class="pdot" style="background:var(--green)"></span>已就绪</div><div class="pspecs">1080p · H.264 · &lt;4GB<br>MP4/FLV · 60fps<br>最长10小时</div></div>
    <div class="pcard douyin"><div class="picon">🎵</div><div class="pname">抖音 Douyin</div><div class="pstatus"><span class="pdot" style="background:var(--green)"></span>已就绪</div><div class="pspecs">1080p · H.264 · &lt;4GB<br>MP4/WEBM · 60fps<br>最长60分钟</div></div>
    <div class="pcard youtube"><div class="picon">▶️</div><div class="pname">YouTube</div><div class="pstatus"><span class="pdot" style="background:var(--green)"></span>已就绪</div><div class="pspecs">4K · H.264/VP9 · 无限制<br>MP4/MOV/WEBM<br>最长12小时</div></div>
  </div>
  <div class="panel"><div class="phead">🚀 发布视频</div><div class="pbody">
    <input id="path" placeholder="视频路径: /data/quanquan/output/proj_xxx.mp4">
    <input id="title" placeholder="视频标题 (1-100字)" maxlength="100">
    <textarea id="desc" rows="2" placeholder="视频描述 (可选)"></textarea>
    <input id="tags" placeholder="标签: AI, 科技, 教程 (逗号分隔)">
    <select id="platform"><option value="bilibili">📺 B站</option><option value="douyin">🎵 抖音</option><option value="youtube">▶️ YouTube</option></select>
    <button class="btn btn-primary" id="pbtn" onclick="publish()">🚀 发布到平台</button>
    <div id="result" class="result"></div>
  </div></div>
</div>
<div id="toasts"></div>
<div class="footer">quanquan v7.0 · 多平台发布引擎</div>
<script>
const A='/api/v1';
function toast(m,t){const c=document.getElementById('toasts'),e=document.createElement('div');e.className='toast t-'+(t||'success');e.textContent=m;c.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='.3s';setTimeout(()=>e.remove(),300)},3000)}
async function publish(){
  const path=document.getElementById('path').value.trim(),title=document.getElementById('title').value.trim();
  if(!path||!title){toast('请填写路径和标题','error');return}
  const btn=document.getElementById('pbtn');btn.disabled=true;btn.textContent='⏳ 发布中...';
  try{
    const r=await fetch(A+'/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video_path:path,title,description:document.getElementById('desc').value.trim(),tags:document.getElementById('tags').value.split(',').map(s=>s.trim()).filter(Boolean),platform:document.getElementById('platform').value})});
    const d=await r.json();
    document.getElementById('result').className='result r-success';
    document.getElementById('result').innerHTML=`<strong>✅ 发布成功</strong><pre style="margin-top:8px;font-size:11px;color:var(--dim)">${JSON.stringify(d,null,2)}</pre>`;
  }catch(e){document.getElementById('result').className='result r-error';document.getElementById('result').innerHTML=`<strong>❌ 失败</strong><p>${e.message}</p>`}
  btn.disabled=false;btn.textContent='🚀 发布到平台';
}
</script>
</body>
</html>

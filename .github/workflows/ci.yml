name: quanquan CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -r requirements.txt || true

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pytest tests/ -v --tb=short --cov=core --cov=agents --cov=api --cov-report=xml

      - name: Type check (basic)
        run: |
          python -c "
          import sys
          modules = [
            'core.director', 'core.chunked_processor', 'core.gpu_encoder',
            'core.multi_platform', 'core.highlight_detector', 'core.super_resolution',
            'core.digital_human', 'core.subtitle_translator', 'core.notification',
            'core.video_to_gif', 'core.config_manager', 'core.vector_store',
            'core.cold_start', 'core.director_notes', 'core.post_export_inspector',
            'core.proxy_editor', 'core.voice_to_video',
            'agents.scriptwriter', 'agents.storyboard', 'agents.voiceover',
            'agents.bgm', 'agents.stylization', 'agents.qc', 'agents.delivery',
            'agents.subtitle', 'agents.memory', 'agents.feedback',
            'adapters.ffmpeg_inspector', 'adapters.jianying', 'adapters.material_library',
            'adapters.music_library', 'adapters.thumbnail_generator',
            'adapters.version_diff',
          ]
          for m in modules:
              try:
                  __import__(m)
                  print(f'  ✅ {m}')
              except Exception as e:
                  print(f'  ❌ {m}: {e}')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check . --select=E,F,W --ignore=E501

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t quanquan:latest .
      - name: Push to registry
        if: false  # 需要配置 DOCKER_USERNAME/DOCKER_PASSWORD secrets
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag quanquan:latest ${{ secrets.DOCKER_USERNAME }}/quanquan:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/quanquan:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy webhook
        run: echo "Deploy triggered"
